; PlatformIO Project Configuration File for RemoteMapper-ESP32
; Model: ESP32-S3-DevKitC-1 N16R8 (16MB Flash, 8MB Octal PSRAM)

[platformio]
default_envs = esp32s3_n16r8
src_dir = src
include_dir = include

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/patches/apply_patches.py

; 16MB Flash & 8MB Octal PSRAM Settings
board_build.mcu = esp32s3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Enable Native USB OTG TinyUSB Stack
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DREMOTEMAPPER_OTA=1
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; Core placement contract. NimBLE's host task must stay on core 0 with the
    ; BLE application task; its own nimconfig.h default would silently drift.
    ; The Arduino loopTask core comes from the generated sdkconfig.h instead and
    ; is asserted against TASK_CORE_USB in src/main.cpp.
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -I include

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.0.4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize

; Isolated USB controller prototype. Never selected by default or OTA tooling.
[env:esp32s3_n16r8_usb_test]
extends = env:esp32s3_n16r8
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -DREMOTEMAPPER_EXPERIMENTAL_DWC2=1

; 8MB Flash & 8MB Octal PSRAM Settings (N8R8)
[env:esp32s3_n8r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
