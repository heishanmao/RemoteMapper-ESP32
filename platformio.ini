; PlatformIO Project Configuration File for RemoteMapper-ESP32
; Model: ESP32-S3-DevKitC-1 N16R8 (16MB Flash, 8MB Octal PSRAM)

[platformio]
default_envs = esp32s3_n16r8
src_dir = src
include_dir = include

[env:esp32s3_n16r8]
platform = espressif32@7.1.3
platform_packages = platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/patches/apply_patches.py

; 16MB Flash & 8MB Octal PSRAM Settings
board_build.mcu = esp32s3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Use the deployed layout explicitly; the SDK and repository both contain
; different files named default_16MB.csv.
board_build.partitions = partitions/remotemapper_n16r8.csv
board_build.arduino.memory_type = qio_opi

; Enable Native USB OTG TinyUSB Stack
; Remove the board's hardware-CDC default; the single effective mode is OTG=0.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DREMOTEMAPPER_OTA=1
    ; Shared DWC2 driver with task/ISR cross-core protection. The default and
    ; USB test alias use exactly this implementation (the bundled DCD is not
    ; linked alongside it).
    -DREMOTEMAPPER_DWC2_DRIVER=1
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; Core placement contract. NimBLE's host task must stay on core 0 with the
    ; BLE application task; its own nimconfig.h default would silently drift.
    ; The Arduino loopTask core comes from the generated sdkconfig.h instead and
    ; is asserted against TASK_CORE_USB in src/main.cpp.
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -I include

lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize

; Compatibility alias for USB stress tooling. Uses the same DWC2 driver and
; firmware version as the N16R8 default; this is not a separate release path.
[env:esp32s3_n16r8_usb_test]
extends = env:esp32s3_n16r8
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -DREMOTEMAPPER_USB_TEST_BUILD=1

; Other hardware profiles retain the bundled USB driver until separately
; validated; version.h marks their images with the legacy-usb suffix.
