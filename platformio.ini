board_build.mcu = esp32s3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; Core placement contract: NimBLE host task stays on core 0. See the
    ; esp32s3_n16r8 environment for the full rationale.
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    -I include
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.0.4

